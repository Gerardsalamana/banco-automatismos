<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Editor y simulador de esquemas eléctricos, de vivienda, neumáticos, electrónicos y de PLC para aprender automatismos.">
<meta name="theme-color" content="#14201D">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%227%22%20fill%3D%22%23F2B705%22%2F%3E%3Cpath%20d%3D%22M16%204v6M16%2022v6%22%20stroke%3D%22%2314201D%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%2212%22%20height%3D%2212%22%20rx%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%2314201D%22%20stroke-width%3D%222.4%22%2F%3E%3C%2Fsvg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<title>Banco de Automatismos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Distribución: barra de herramientas arriba · cajón de componentes a la izquierda ·
   pestañas de planos + hoja de dibujo (papel de plano, igual en los dos temas) al centro ·
   propiedades y estado a la derecha */
:root{
  --chrome:#E6EAE8; --panel:#F6F8F7; --raise:#FFFFFF; --line:#D2D9D6; --line2:#E3E8E6;
  --text:#14201D; --muted:#56635F; --faint:#86918D;
  --sheet:#EEF2F0; --gdot:#B9C4C0; --gmaj:#8F9E99; --ink:#1A2724; --inkdim:rgba(26,39,36,.36); --inkmid:#4A5754;
  --sel:#2A62D6; --selfill:rgba(42,98,214,.08);
  --accent:#F2B705; --accent-2:#B98C00; --accent-ink:#1D1600;
  --stop:#C9342A; --ok:#177A41; --warn:#9A5B00; --err:#C9342A;
  --onfill:#FFD54A;
  --l1:#8A4A22; --l2:#1B1B1B; --l3:#8B939A; --n:#2462C8; --pe:#4E9C2C; --mix:#8B6AB6; --dc:#D0342C; --sec:#E07A10;
  --chip-on:#DCF0E3; --chip-on-t:#13683A; --chip-al:#FAE0DC; --chip-al-t:#A3241A;
  --chip-w:#FBEBC8; --chip-w-t:#7F4C00; --chip-off:#E8ECEA; --chip-off-t:#56635F;
  --shadow:0 10px 30px rgba(20,32,29,.16),0 2px 6px rgba(20,32,29,.08);
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --f-disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#0E1211; --panel:#141918; --raise:#1B2220; --line:#29322F; --line2:#212927;
  --text:#DFE6E3; --muted:#97A3A0; --faint:#6B7773;
  --sheet:#CCD4D0; --gdot:#9AA7A2; --gmaj:#7C8B86; --selfill:rgba(42,98,214,.13);
  --chip-on:#15331F; --chip-on-t:#82DBA6; --chip-al:#3B1613; --chip-al-t:#FF9F95;
  --chip-w:#382A0B; --chip-w-t:#F4C46E; --chip-off:#202826; --chip-off-t:#97A3A0;
  --shadow:0 12px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#0E1211; --panel:#141918; --raise:#1B2220; --line:#29322F; --line2:#212927;
  --text:#DFE6E3; --muted:#97A3A0; --faint:#6B7773;
  --sheet:#CCD4D0; --gdot:#9AA7A2; --gmaj:#7C8B86; --selfill:rgba(42,98,214,.13);
  --chip-on:#15331F; --chip-on-t:#82DBA6; --chip-al:#3B1613; --chip-al-t:#FF9F95;
  --chip-w:#382A0B; --chip-w-t:#F4C46E; --chip-off:#202826; --chip-off-t:#97A3A0;
  --shadow:0 12px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}

/* Lo oculto se queda oculto aunque una regla de la página diga display:flex (el buscador y el inicio lo necesitan) */
[hidden],.modal[hidden],.home[hidden],.menu[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--chrome);color:var(--text);font:14px/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr);grid-template-columns:232px minmax(0,1fr) 300px;
  grid-template-areas:"bar bar bar" "pal stage insp"}

/* ---- barra ---- */
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:0}
.bar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;padding-right:6px;flex:none}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font:700 19px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.brand span{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--muted);margin-top:3px}
.grp{display:flex;gap:4px;padding-left:10px;border-left:1px solid var(--line);flex:none;align-items:center}
.btn{height:34px;padding:0 11px;border:1px solid var(--line);background:var(--raise);border-radius:7px;display:inline-flex;gap:7px;align-items:center;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.ib{width:34px;padding:0;justify-content:center}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.pri{background:var(--text);color:var(--panel);border-color:var(--text)}
.btn.danger{color:var(--err)}
.btn.sm{height:30px;font-size:12.5px;padding:0 9px}
.wsw{width:34px;padding:0;justify-content:center}
.wsw i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid var(--raise)}
.find{width:210px;justify-content:space-between;color:var(--muted)}
.find kbd{font-size:10.5px}
.sp{flex:1 0 8px}
.run{height:38px;padding:0 18px 0 12px;border-radius:19px;background:var(--accent);border:1px solid var(--accent-2);color:var(--accent-ink);
  font:700 16px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;cursor:pointer;flex:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),0 1px 0 rgba(255,255,255,.4) inset}
.run i{width:13px;height:13px;border-radius:50%;background:var(--accent-ink);display:block;position:relative}
.run i::after{content:"";position:absolute;left:4.5px;top:3px;border-left:6px solid var(--accent);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.live .run{background:var(--stop);border-color:#8E2119;color:#fff}
.live .run i{background:#fff;animation:pulso 1.1s ease-in-out infinite}
.live .run i::after{left:3.5px;top:3.5px;width:6px;height:6px;border:0;background:var(--stop)}
@keyframes pulso{50%{box-shadow:0 0 0 5px rgba(255,255,255,.18)}}
.menu{position:fixed;z-index:60;min-width:270px;max-height:calc(100% - 80px);overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.menu button.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:7px;cursor:pointer}
.menu button.mi:hover,.menu button.mi:focus-visible{background:var(--chrome)}
.menu b{display:block;font-weight:600;font-size:13.5px}
.menu small{display:block;color:var(--muted);font-size:12px}
.menu kbd{flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu h5{margin:8px 11px 4px;font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.swg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 8px 8px}
.chip{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--raise);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.chip i{width:20px;height:20px;border-radius:50%;display:block}
.chip.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--selfill)}
.seg{display:flex;gap:4px}
.seg button{flex:1;height:32px;border:1px solid var(--line);background:var(--raise);border-radius:7px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{border-color:var(--sel);background:var(--selfill)}
.seg i{display:block;width:22px;border-radius:2px;background:var(--text)}

/* ---- cajón de componentes ---- */
.pal{grid-area:pal;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 12px 28px;min-height:0}
.search{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--raise);padding:0 10px;margin-bottom:6px}
.pc h3{margin:14px 2px 6px;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.it{border:1px solid transparent;background:none;border-radius:8px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;min-width:0;touch-action:none}
.it:hover{background:var(--raise);border-color:var(--line)}
.it.on{background:var(--selfill);border-color:var(--sel)}
.it .ic{width:100%;height:40px;display:flex;align-items:center;justify-content:center;background:var(--sheet);border-radius:5px}
.it .ic svg{width:78%;height:34px}
.it .nm{font-size:11.5px;line-height:1.2;text-align:center;color:var(--text)}
.live .pal{opacity:.4;pointer-events:none}

/* ---- pestañas + hoja ---- */
.stage{grid-area:stage;display:grid;grid-template-rows:38px minmax(0,1fr);min-width:0;min-height:0;background:var(--sheet)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;min-width:0}
.tab{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;cursor:pointer;max-width:230px;flex:none;color:var(--muted);font-size:12.5px;font-weight:500}
.tab:hover{background:var(--panel)}
.tab.on{background:var(--sheet);border-color:var(--line);color:#14201D;margin-bottom:-1px;height:33px}
.tab .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tab input{width:150px;height:24px;border:1px solid var(--sel);border-radius:5px;background:var(--raise);color:var(--text);padding:0 6px;font-size:12.5px}
.tab .tx{width:22px;height:22px;border:0;background:none;border-radius:5px;cursor:pointer;color:var(--faint);font-size:16px;line-height:1;flex:none}
.tab .tx:hover{background:var(--chrome);color:var(--text)}
.tadd{width:28px;height:28px;margin:0 0 3px 4px;border:1px dashed var(--line);background:none;border-radius:7px;cursor:pointer;color:var(--muted);font-size:17px;flex:none}
.tadd:hover{border-color:var(--faint);color:var(--text)}
.sst{margin:0 4px 9px auto;padding-left:12px;font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;flex:none}
.sst.cloud::before{content:"● ";color:var(--ok)}
.sst.local::before{content:"● ";color:var(--accent-2)}
.sst.fail::before{content:"● ";color:var(--err)}
.canvas{position:relative;min-width:0;min-height:0;overflow:hidden}
#sv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.tool-wire #sv{cursor:crosshair}
.tool-place #sv{cursor:copy}
.panning #sv{cursor:grabbing}
.gdot{fill:var(--gdot)} .gmaj{fill:var(--gmaj)}
.cp line,.cp path,.cp rect,.cp circle{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cp .hit{fill:transparent;stroke:none}
.cp .dash{stroke-dasharray:4 4;stroke-width:1.5}
.cp .fill{fill:var(--ink)}
.cp .on{fill:var(--onfill)}
.cp .warn{stroke:var(--err)}
.cp .trip{fill:rgba(201,52,42,.13);stroke:var(--err)}
.cp .trk{fill:rgba(26,39,36,.14);stroke:none}
.cp .prg{fill:var(--ink);stroke:none}
.cp .glow{stroke:none}
.cp .mrun{fill:rgba(23,122,65,.1)}
.cp .rot{stroke-dasharray:7 6;stroke-width:2.4}
.cp .buzz{stroke:var(--err);stroke-dasharray:3 4;stroke-width:1.6}
.cp .sw{stroke:none}
.cp .mush{fill:#D0342C}
.cp .wave{stroke:var(--err);stroke-width:1.6}
.cp .rod{stroke-width:5}
.cp .piston{fill:var(--ink)}
.cp .act{fill:rgba(201,52,42,.16);stroke:var(--err)}
.cp .term{fill:var(--sheet)}
.sw-l1{fill:var(--l1)} .sw-l2{fill:var(--l2)} .sw-l3{fill:var(--l3)} .sw-n{fill:var(--n)} .sw-pe{fill:var(--pe)} .sw-dc{fill:var(--dc)}
.cp text,.wl{fill:var(--ink);stroke:none}
.tg{font:600 12px var(--f-mono)}
.tn{font:500 9.5px var(--f-mono);fill:var(--inkmid)!important}
.gl{font:600 11px var(--f-ui)}
.hd{font:600 9.5px var(--f-mono);letter-spacing:.06em}
.pl{font:600 10.5px var(--f-mono)}
.mt{font:600 17px var(--f-ui)}
.ms{font:500 11px var(--f-mono)}
.note{font:500 14px var(--f-ui)}
.wl{font:600 10px var(--f-mono)}
.st{font:600 11px var(--f-ui)}
.st.ok{fill:var(--ok)!important} .st.err{fill:var(--err)!important} .st.warn{fill:var(--warn)!important}
.cp.ghost{opacity:.5;pointer-events:none}
.live .cp.ia .hit{cursor:pointer}
.wire{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.wire.thick{stroke-width:3.4}
.wire.peo{stroke:#E9C81C;stroke-dasharray:9 9}
.whit{fill:none;stroke:transparent;stroke-width:12}
.live .whit{pointer-events:none}
.wire.sel{stroke:var(--sel)!important;stroke-width:3.4}
.wire.w-l1{stroke:var(--l1);stroke-width:3} .wire.w-l2{stroke:var(--l2);stroke-width:3} .wire.w-l3{stroke:var(--l3);stroke-width:3}
.wire.w-n{stroke:var(--n);stroke-width:3} .wire.w-pe{stroke:var(--pe);stroke-width:3;stroke-dasharray:12 7}
.wire.w-dc{stroke:var(--dc);stroke-width:3} .wire.w-sec{stroke:var(--sec);stroke-width:3}
.wire.w-mix{stroke:var(--mix);stroke-width:2.6} .wire.w-dead{stroke:var(--inkdim)} .wire.w-err{stroke:var(--err);stroke-width:4.5}
.wire.w-off{opacity:.32}
.jn{fill:var(--ink)} .jn.w-l1{fill:var(--l1)} .jn.w-l2{fill:var(--l2)} .jn.w-l3{fill:var(--l3)} .jn.w-n{fill:var(--n)} .jn.w-pe{fill:var(--pe)} .jn.w-dc{fill:var(--dc)} .jn.w-sec{fill:var(--sec)} .jn.w-mix{fill:var(--mix)} .jn.w-dead{fill:var(--inkdim)} .jn.w-err{fill:var(--err)}
.selbox{fill:var(--selfill);stroke:var(--sel);stroke-width:1.2;stroke-dasharray:5 4}
.mbox{fill:var(--selfill);stroke:var(--sel);stroke-width:1}
.draft{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:6 5}
.pinfree{fill:var(--sheet);stroke:var(--sel);stroke-width:1.3;pointer-events:none}
.jn,.wl,.flash,.selbox,.draft,.hov,.wbad{pointer-events:none}
.live .pinfree{display:none}
.hov{fill:none;stroke:var(--sel);stroke-width:1.5}
.hov.ok{stroke:var(--ok);fill:rgba(23,122,65,.16);stroke-width:2}
.flash{fill:none;stroke:var(--sel);stroke-width:3;animation:flash 1.4s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

.legend{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);border:1px solid rgba(26,39,36,.14);border-radius:999px;padding:3px 9px 3px 6px;font:500 11px var(--f-mono);color:#1A2724}
.legend i{width:16px;height:4px;border-radius:2px;display:block}
.banner{position:absolute;left:50%;top:48px;transform:translateX(-50%);max-width:min(560px,calc(100% - 24px));background:var(--stop);color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow);text-align:center}
.banner.warn{background:#8A5200}
.hint{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 260px);font-size:12px;color:#33413D;background:rgba(255,255,255,.78);border:1px solid rgba(26,39,36,.12);border-radius:8px;padding:6px 10px;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zoom button{height:28px;min-width:28px;border:0;background:none;border-radius:6px;cursor:pointer;font-weight:600;padding:0 8px}
.zoom button:hover{background:var(--chrome)}
.zoom span{font:500 11.5px var(--f-mono);min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 24px);text-align:center;pointer-events:none;z-index:5}
.toast.err{background:var(--stop);color:#fff}

/* ---- panel derecho ---- */
.insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.insp-tog{display:none}
#ib{padding:16px 16px 28px}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ph .pic{width:54px;height:48px;border-radius:8px;background:var(--sheet);display:flex;align-items:center;justify-content:center;flex:none}
.ph .pic svg{width:44px;height:38px}
.ty{font:700 20px/1.05 var(--f-disp);letter-spacing:.02em;text-transform:uppercase}
.cat{font:500 11px var(--f-mono);color:var(--muted);margin-top:3px;letter-spacing:.04em}
.desc{color:var(--muted);font-size:13px;margin:0 0 14px;text-wrap:pretty}
.fld{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.fld>span{font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{height:36px;border:1px solid var(--line);border-radius:7px;background:var(--raise);padding:0 10px;width:100%;min-width:0}
.fld input.tag{font:600 15px var(--f-mono);letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 12px;cursor:pointer}
.link{font-size:12.5px;border-radius:8px;padding:8px 10px;margin:-2px 0 14px;background:var(--chip-on);color:var(--chip-on-t)}
.link.no{background:var(--chip-w);color:var(--chip-w-t)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.terms{font:500 11.5px var(--f-mono);color:var(--muted)}
h4{margin:20px 0 8px;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;counter-increment:s}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--panel);font:600 11px/22px var(--f-mono);text-align:center}

.leg{display:grid;gap:6px;font-size:12.5px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:26px;height:5px;border-radius:3px;display:block;flex:none}
.stats{font:500 12px var(--f-mono);color:var(--muted)}
.dev{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.dev .dt{font:600 13px var(--f-mono)}

.pill{font:600 11px/1 var(--f-ui);padding:5px 8px;border-radius:999px;background:var(--chip-off);color:var(--chip-off-t);white-space:nowrap;font-variant-numeric:tabular-nums}

.cmd{width:min(620px,100%)}

.ci{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer}

.ci b{font-weight:600;font-size:13.5px}
.ci small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .k{font:500 10.5px var(--f-mono);color:var(--faint)}

/* ---- inicio, como la entrada de Word: carril de secciones + plantillas + recientes ---- */
.home{position:fixed;inset:0;z-index:70;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--panel)}
.hrail{background:#14201D;color:#E6ECE9;display:flex;flex-direction:column;gap:2px;padding:18px 12px 16px;min-height:0;overflow-y:auto}

.hnav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border:0;border-radius:8px;background:none;color:#C9D3CF;font-size:14px;font-weight:500;cursor:pointer;text-align:left;position:relative;flex:none}

.hcloud{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding:12px 8px 10px;display:grid;gap:8px}

.hcloud .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.28);height:32px;font-size:12.5px;justify-content:center;white-space:normal;line-height:1.2}

.hwrap{max-width:1080px;margin:0 auto}
.hmain h1{margin:0 0 8px;font:700 36px/1.05 var(--f-disp);letter-spacing:.02em;text-transform:uppercase}
.hmain h2{margin:30px 0 12px;font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:18px}
.tpl{display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--text);min-width:0}

.tpl .th svg{width:94%;height:94%}

.hsearch{height:34px;width:min(300px,100%);border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:0 12px;font:400 13px var(--f-ui);letter-spacing:0;text-transform:none;color:var(--text)}
.frows{display:grid;border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:58px minmax(0,1fr) 140px 120px auto;gap:14px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line2)}
.frow:hover{background:var(--raise)}
.fth{width:58px;height:44px;border-radius:6px;background:var(--sheet);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.fth svg{width:100%;height:100%}
.fnm{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0;color:var(--text)}
.fnm b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnm small{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-top:2px}
.fnm:hover b{text-decoration:underline}
.fdt,.fct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fact{display:flex;gap:4px;opacity:0}
.frow:hover .fact,.frow:focus-within .fact{opacity:1}
@media (hover:none){.fact{opacity:1}}
.hempty{padding:28px 6px;color:var(--muted);font-size:13px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:18px 0 12px}
.drop.over{border-color:var(--sel);background:var(--selfill)}

.hstore .sst{margin:0;padding:0}

/* ---- programa del PLC (bandeja inferior de la hoja) ---- */
.plcd{position:absolute;left:0;right:0;bottom:0;height:min(330px,56%);display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,32,29,.12);z-index:5}
.canvas.plc-open .zoom,.canvas.plc-open .hint{bottom:calc(min(330px,56%) + 12px)}
.sheets{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:3px;max-width:calc(100% - 260px);overflow-x:auto;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08);scrollbar-width:thin}
.sheets .sh{height:28px;border:0;background:none;border-radius:6px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.sheets .sh:hover{background:var(--chrome);color:var(--text)}

.sheets .sh.conf{background:var(--chip-al);color:var(--chip-al-t)}

.sheets input{width:120px;height:26px;border:1px solid var(--sel);border-radius:5px;background:var(--raise);color:var(--text);padding:0 6px;font-size:12.5px}
.hint{bottom:58px!important}
.canvas.plc-open .sheets{bottom:calc(min(330px,56%) + 12px)}
.canvas.plc-open .hint{bottom:calc(min(330px,56%) + 58px)!important}
@media (max-width:760px){.sheets{max-width:calc(100% - 24px);bottom:62px}.canvas.plc-open .sheets{bottom:calc(min(380px,62%) + 62px)}}
/* en móvil el panel de estado flota sobre la hoja: el zoom y las hojas suben para no quedar debajo */

.plcd header{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}

.plcd .pio{display:flex;gap:3px;flex-wrap:wrap;margin-right:auto;min-width:0}
.plcd .pio span{font:600 10.5px/1 var(--f-mono);padding:4px 5px;border-radius:5px;background:var(--chip-off);color:var(--chip-off-t)}
.plcd .pio span.on{background:var(--chip-on);color:var(--chip-on-t)}
.plcd .pio i{width:8px}
.plcd .pst{font:600 11px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--chip-off);color:var(--chip-off-t)}
.plcd .pst.on{background:var(--chip-on);color:var(--chip-on-t)} .plcd .pst.al{background:var(--chip-al);color:var(--chip-al-t)}
.plcd .pbody{overflow:auto;padding:8px 10px 14px;flex:1;min-height:0}
.plcd .pnote{margin:2px 4px 10px;font-size:12.5px;color:var(--muted)}
.rung{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start;padding:8px 6px;border-bottom:1px solid var(--line2)}
.rung .rh b{display:block;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rung .rx{margin:5px 0 6px;font:500 12px/1.35 var(--f-mono);color:var(--text);word-break:break-word}

.rung svg{display:block;max-width:none;background:var(--sheet);border-radius:8px}
.rsc{overflow-x:auto;min-width:0}
.ld line,.ld path,.ld rect,.ld circle{stroke:#33413D;stroke-width:2;fill:none;stroke-linecap:round}
.ld .pw{stroke:#1E9A4C;stroke-width:3}

.ld .k.on .cbg{fill:rgba(255,213,74,.55)}

<script>
(function(){
'use strict';
const G = 20, VPH = 230;
const $ = s => document.querySelector(s);
const hx = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
const fmtS = v => String(Math.round((+v || 0) * 10) / 10).replace('.', ',');
const plain = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const today = () => new Date().toLocaleDateString('es-ES');

/* ---------- números complejos (fasores de 50 Hz) ---------- */
const cx = (re, im) => ({re, im: im || 0}), ZERO = cx(0, 0);
const csub = (a, b) => cx(a.re - b.re, a.im - b.im);
const cadd = (a, b) => cx(a.re + b.re, a.im + b.im);
const cmul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const cabs = a => Math.hypot(a.re, a.im);
const pol = (m, d) => cx(m * Math.cos(d * Math.PI / 180), m * Math.sin(d * Math.PI / 180));
const OP_A = pol(1, 120), OP_A2 = pol(1, 240);
/* Cada borne de alimentación: clave (dos claves distintas en el mismo nudo = cortocircuito), fasor y color. */
const SRC = {
  L1: {k: 'L1', v: pol(VPH, 0), cls: 'l1', nm: 'L1'},
  L2: {k: 'L2', v: pol(VPH, -120), cls: 'l2', nm: 'L2'},
  L3: {k: 'L3', v: pol(VPH, 120), cls: 'l3', nm: 'L3'},
  N: {k: 'N', v: ZERO, cls: 'n', nm: 'N'},
  PE: {k: 'N', v: ZERO, cls: 'pe', nm: 'PE'},
  P24: {k: 'P24', v: cx(24, 0), cls: 'dc', nm: '+24 V'},
  M0: {k: 'N', v: ZERO, cls: 'n', nm: '0 V'}
};

/* ---------- primitivas SVG ---------- */
const ln = (a, b, c, d, k) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${k ? ` class="${k}"` : ''}/>`;
const pa = (d, k) => `<path d="${d}"${k ? ` class="${k}"` : ''}/>`;
const rc = (x, y, w, h, k, r) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${r ? ` rx="${r}"` : ''}${k ? ` class="${k}"` : ''}/>`;
const ci = (x, y, r, k) => `<circle cx="${x}" cy="${y}" r="${r}"${k ? ` class="${k}"` : ''}/>`;
const pathD = pts => 'M' + pts.map(p => p[0] * G + ' ' + p[1] * G).join('L');

function rot(x, y, r) {
  switch (((r || 0) % 360 + 360) % 360) {
    case 90: return [-y, x];
    case 180: return [-x, -y];
    case 270: return [y, -x];
    default: return [x, y];
  }
}

/* Contacto vertical: borne fijo arriba (y=-40) y móvil abajo (y=40). Cierra entre y=-12 e y=12. */
function blade(no, cl) {
  let s = ln(0, -40, 0, -12) + ln(0, 12, 0, 40);
  if (no) s += cl ? ln(0, 12, -2, -12) : ln(0, 12, -12, -9);
  else s += ln(0, -12, 10, -12) + (cl ? ln(0, 12, 12, -15) : ln(0, 12, -8, -9));
  return s;
}
function bmid(no, cl) { return no ? (cl ? [-1, 0] : [-6, 1.5]) : (cl ? [6, -1.5] : [-4, 1.5]); }
const DIAMOND = 'M-24 -7L-17 0L-24 7L-31 0Z';
function actuator(kind, m, pushed) {
  const d = pushed ? 5 : 0, link = x => ln(x, 0, m[0], m[1], 'dash');
  switch (kind) {
    case 'push': return ln(-18 + d, 0, m[0], m[1], 'dash') + pa(`M${-12 + d} -7H${-18 + d}V7H${-12 + d}`);
    case 'toggle': return link(-18) + pa('M-18 -7V7M-18 -7H-13M-18 7L-22 3');
    case 'limit': return link(-18) + ci(-23, 0, 5);
    case 'emerg': return link(-18) + pa('M-18 -9V9') + pa('M-18 -10A10 10 0 0 0 -18 10', 'mush');
    case 'prox': return link(-17) + pa(DIAMOND) + ln(-27, 3, -21, -3);
    case 'photo': return link(-17) + pa(DIAMOND) + pa('M-42 -10L-34 -5M-37 -5H-34V-8M-42 -1L-34 4M-37 4H-34V1');
    case 'box': return link(-18) + rc(-33, -8, 15, 16);
    case 'cap': return link(-17) + pa(DIAMOND) + ln(-26, -3, -26, 3) + ln(-22, -3, -22, 3);
    case 'clock': return link(-17) + ci(-24, 0, 7) + pa('M-24 -4V0H-21');
    case 'level': return link(-18) + ln(-32, 8, -16, 8) + ci(-24, 2, 4);
    case 'ton': return ln(-12, 0, m[0], m[1], 'dash') + pa('M-12 -7A7 7 0 0 0 -12 7');
    case 'toff': return ln(-13, 0, m[0], m[1], 'dash') + pa('M-20 -7A7 7 0 0 1 -20 7');
    case 'thermal': return link(-20) + pa('M-28 5V-4H-21V5');
  }
  return '';
}

/* ---------- catálogo de componentes ---------- */
const T = {};
const LAMP = {verde: '#25A955', rojo: '#E3382B', ambar: '#F2A000', blanco: '#F5F1E4', azul: '#2B79E6'};
const LAMPN = {verde: 'verde', rojo: 'roja', ambar: 'ámbar', blanco: 'blanca', azul: 'azul'};
const UNS = [24, 48, 110, 230, 400];
function reg(o) { o.defaults = o.defaults || {}; T[o.k] = o; return o; }
const restOf = (c, t) => { t = t || T[c.type]; return t.inv ? !!(c.p && c.p.nc) : !!t.rest; };
const numsOf = (c, t) => { t = t || T[c.type]; return t.inv && c.p && c.p.nc ? ['11', '12'] : t.nums; };

function C2(o) {
  return reg(Object.assign({
    kind: 'sw', pins: [[0, -2], [0, 2]], box: [-36, -42, 16, 42],
    draw(c, st) {
      const no = !restOf(c, this);
      let s = blade(no, st.closed);
      let a = this.act;
      if (this.drive === 'timer') a = timerMode(c.tag) === 'off' ? 'toff' : 'ton';
      if (a) s += actuator(a, bmid(no, st.closed), st.pushed);
      return s;
    },
    labels(c) {
      const n = numsOf(c, this);
      const L = [{x: 16, y: -2, t: c.tag, cls: 'tg'}, {x: 6, y: -31, t: n[0], cls: 'tn'}, {x: 6, y: 31, t: n[1], cls: 'tn'}];
      if (this.glyph) L.push({x: -25.5, y: 0.5, t: this.glyph, cls: 'gl', a: 'middle'});
      return L;
    }
  }, o));
}
function polesN(xs, st, mark) {
  let s = '', m0, mL;
  xs.forEach((x, i) => {
    s += `<g transform="translate(${x} 0)">${blade(true, st.closed)}${mark}</g>`;
    const m = bmid(true, st.closed);
    if (i === 0) m0 = [x + m[0], m[1]];
    mL = [x + m[0], m[1]];
  });
  return {s, m0, m2: mL};
}
const poles3 = (st, mark) => polesN([-40, 0, 40], st, mark);
function P3(o) {
  return reg(Object.assign({
    kind: 'sw3', pins: [[-2, -2], [0, -2], [2, -2], [-2, 2], [0, 2], [2, 2]], poles: [[0, 3], [1, 4], [2, 5]], box: [-56, -42, 48, 42], tagx: -60,
    labels(c, st) {
      const L = [{x: this.tagx, y: 0, t: c.tag, cls: 'tg'}];
      const n = this.nums || ['1', '3', '5', '2', '4', '6'];
      [-40, 0, 40].forEach((x, i) => { L.push({x: x + 6, y: -31, t: n[i], cls: 'tn'}, {x: x + 6, y: 31, t: n[i + 3], cls: 'tn'}); });
      if (this.more) L.push(...this.more(c, st));
      return L;
    }
  }, o));
}
function coilDraw(st, timer) {
  let s = ln(0, -40, 0, -11) + ln(0, 11, 0, 40) + rc(-18, -11, 36, 22, (st.on ? 'on' : '') + (st.warn ? ' warn' : ''));
  if (timer === 'on') s += rc(-18, -11, 11, 22) + ln(-18, -11, -7, 11) + ln(-7, -11, -18, 11);
  if (timer === 'off') s += rc(-18, -11, 11, 22, 'fill');
  if (timer === 'valve') s += ln(-18, 11, 18, -11);
  if (timer === 'tele') s += rc(-18, -11, 11, 22) + pa('M-16 5V-4H-12.5V5H-9V-4');
  if (st.prog != null) s += rc(-3, 4, 17, 3, 'trk') + rc(-3, 4, Math.max(0.6, 17 * st.prog).toFixed(1), 3, 'prg');
  return s;
}
const unLabel = c => (+c.p.Un || 230) === 230 ? '' : (+c.p.Un) + ' V';
function COIL(o) {
  return reg(Object.assign({
    kind: 'load', role: 'coil', R: 2000, pins: [[0, -2], [0, 2]], box: [-22, -42, 22, 42], hasUn: true,
    draw(c, st) { return coilDraw(st, this.timer); },
    labels(c, st) {
      const L = [{x: 26, y: -2, t: c.tag, cls: 'tg'}, {x: 6, y: -31, t: 'A1', cls: 'tn'}, {x: 6, y: 31, t: 'A2', cls: 'tn'}];
      const extra = [this.timer === 'on' || this.timer === 'off' ? fmtS(c.p.delay) + ' s' : '', unLabel(c)].filter(Boolean).join(' · ');
      if (extra) L.push({x: 26, y: 12, t: extra, cls: 'tn'});
      if (st.warn) L.push({x: 26, y: 26, t: 'sobretensión', cls: 'st err'});
      return L;
    }
  }, o));
}
function motTop() { return ln(-40, -40, -40, -26) + ln(-40, -26, -18, -5) + ln(0, -40, 0, -12) + ln(40, -40, 40, -26) + ln(40, -26, 18, -5); }
function motBot() { return ln(-40, 60, -40, 48) + ln(-40, 48, -18, 33) + ln(0, 60, 0, 40) + ln(40, 60, 40, 48) + ln(40, 48, 18, 33); }
function motBody(st, cy, r) {
  let s = ci(0, cy, r, (st.spd || 0) > 0.02 ? 'mrun' : '');
  if ((st.spd || 0) > 0.01) s += `<circle cx="0" cy="${cy}" r="${r - 7}" class="rot" transform="rotate(${(st.ang || 0).toFixed(1)} 0 ${cy})"/>`;
  if (st.buzz) s += ci(0, cy, r + 5, 'buzz');
  return s;
}
function stLabels(c, st, x, y) {
  const L = [{x, y, t: c.tag, cls: 'tg', a: 'start'}];
  if (st.state) L.push({x, y: y + 15, t: st.state, cls: 'st ' + (st.k || ''), a: 'start'});
  return L;
}
function srcBox(w, items) {
  let s = rc(-w / 2, -30, w, 36, '', 4);
  items.forEach(([x, cls]) => { s += ln(x, 6, x, 20) + `<rect x="${x - 9}" y="1" width="18" height="3" class="sw sw-${cls}"/>`; });
  return s;
}

/* Alimentación */
reg({k: 'src3', name: 'Red trifásica con neutro', short: 'Red 3F+N', cat: 'Alimentación', kind: 'src',
  pins: [[-4, 1], [-2, 1], [0, 1], [2, 1], [4, 1]], pot: ['L1', 'L2', 'L3', 'N', 'PE'], box: [-104, -34, 104, 22],

  labels(c) { return [{x: 22, y: -2, t: c.tag, cls: 'tg'}, {x: 22, y: 12, t: [LAMPN[c.p.color] || '', unLabel(c)].filter(Boolean).join(' · '), cls: 'tn'}]; }

/* ---- Aparatos de varios polos (2 o 4) ---- */
function PN(o) {
  const xs = o.xs, n = xs.length;
  return reg(Object.assign({
    kind: 'sw3', drive: 'self', prefix: 'Q', pins: xs.map(x => [x / 20, -2]).concat(xs.map(x => [x / 20, 2])), poles: xs.map((_, i) => [i, i + n]),
    labels(c, st) {
      const L = [{x: this.tagx, y: 0, t: c.tag, cls: 'tg'}];
      xs.forEach((x, i) => L.push({x: x + 6, y: -31, t: this.nums[i], cls: 'tn'}, {x: x + 6, y: 31, t: this.nums[i + n], cls: 'tn'}));
      if (this.more) L.push(...this.more(c, st));
      if (st.state) L.push({x: this.tagx, y: 30, t: st.state, cls: 'st ' + st.k, a: 'end'});
      return L;
    }
  }, o));
}

/* ---- Electrónica ----
   Los semiconductores se resuelven por tramos: cada diodo conduce o bloquea según su tensión en continua,
   y el circuito se recalcula hasta que todos los estados son coherentes. */
const OHMS = [10, 47, 100, 220, 470, 1000, 2200, 4700, 10000, 47000, 100000];
const fmtOhm = r => r >= 1000 ? fmtS(r / 1000) + ' kΩ' : r + ' Ω';
const fmtI = i => i >= 1 ? fmt1(i) + ' A' : Math.round(i * 1000) + ' mA';
function dioSym(st, on) { return ln(0, -40, 0, -9) + ln(0, 9, 0, 40) + pa('M-11 -9H11L0 9Z', on ? 'dfill' : '') + ln(-11, 9, 11, 9, st.burnt ? 'burnt' : ''); }
reg({k: 'resis', name: 'Resistencia', short: 'Resistencia', cat: 'Electrónica', kind: 'resis', prefix: 'R', defaults: {ohm: 1000, pw: 0.5},
  pins: [[0, -2], [0, 2]], box: [-12, -42, 56, 42],
  desc: 'Limita la corriente: I = V / R. Imprescindible delante de un LED o en la base de un transistor. Si disipa más del doble de su potencia, se quema y abre el circuito.',
  draw(c, st) { return ln(0, -40, 0, -20) + ln(0, 20, 0, 40) + rc(-7, -20, 14, 40, 'rbody' + (st.hot ? ' hotr' : '') + (st.burnt ? ' burnt' : '')) + (st.burnt ? ln(-10, -10, 10, 10, 'burnt') + ln(10, -10, -10, 10, 'burnt') : ''); },
  labels(c, st) { return [{x: 14, y: -6, t: c.tag, cls: 'tg', a: 'start'}, {x: 14, y: 8, t: fmtOhm(+c.p.ohm || 1000) + ' · ' + fmtS(+c.p.pw || 0.5) + ' W', cls: 'tn', a: 'start'}].concat(st.burnt ? [{x: 14, y: 22, t: 'quemada', cls: 'st err', a: 'start'}] : st.p != null ? [{x: 14, y: 22, t: (st.p < 1 ? Math.round(st.p * 1000) + ' mW' : fmt1(st.p) + ' W'), cls: 'st ' + (st.hot ? 'warn' : 'ok'), a: 'start'}] : []); }
});

reg({k: 'led', name: 'LED (diodo luminoso)', short: 'LED', cat: 'Electrónica', kind: 'semi', prefix: 'V', gOn: 1 / 30, imax: 0.06, defaults: {color: 'rojo'},

/* Puntuación de un componente para lo que se ha escrito: el nombre manda sobre los sinónimos */
function compScore(k, words) {
  const t = T[k], name = plain(t.name + ' ' + t.short), kw = plain(KW[k] || ''), all = name + ' ' + kw + ' ' + plain(t.cat);
  if (!words.every(w => all.includes(w))) return 0;
  let s = 1;
  for (const w of words) {
    if (new RegExp('(^|\\s)' + w).test(name)) s += 4; else if (name.includes(w)) s += 2;
    if (kw.startsWith(w)) s += 5; else if (new RegExp('(^|\\s)' + w).test(kw)) s += 3;
  }
  return s;
}

/* Dibuja cada hoja con contenido y recoge sus trazos para exportarla */
function sheetsOps() {
  const sd = doc, sg = GEO, ss = selection, out = [];
  try {
    selection = new Set();
    book.sheets.forEach((s, i) => { if (!s.comps.length && !s.wires.length) return; doc = s; GEO = geo(); draw(); out.push({ops: collectOps(), name: s.name, i}); });
  } finally { doc = sd; GEO = sg; selection = ss; draw(); }
  return out;
}
async function exportAs(kind) {

  if (!allComps().length && !allWires().length) { toast('El plano está vacío: no hay nada que exportar'); return; }
  try { await document.fonts.ready; } catch (_) {}
  const base = fileBase();
  if (kind === 'pdf4' || kind === 'pdf3' || kind === 'dxf') {
    /* PDF: una página por hoja · DXF: un archivo por hoja dentro del zip */
    const pages = sheetsOps();
    if (kind === 'dxf') await offer(base + '-dxf.zip', zipStore(pages.map(pg => ({name: pages.length > 1 ? base + '-' + (pg.i + 1) + '-' + (plain(pg.name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'hoja') + '.dxf' : base + '.dxf', data: dxfDoc(pg.ops)}))));
    else await offer(base + '.pdf', new Blob([pdfDoc(pages, kind === 'pdf3' ? 'A3' : 'A4')], {type: 'application/pdf'}));
    return;
  }
  if (!doc.comps.length && !doc.wires.length) { toast('Esta hoja está vacía: cambie a una hoja con esquema'); return; }
  const ops = collectOps();
  if (false) {}
  else if (kind === 'svg') await offer(base + '.svg', svgDoc(ops));
  else if (kind === 'png') await offer(base + '.png', await pngBlob(ops));
}

  const md = acct.mode, em = hx(acct.email);
  const tabs3 = `<div class="seg"><button class="${md === 'login' ? 'on' : ''}" data-accm="login">Iniciar sesión</button><button class="${md === 'signup' ? 'on' : ''}" data-accm="signup">Crear cuenta</button></div>`;
  if (md === 'reset') return h + `<div class="acc">${m}<h4 style="margin-top:0">Recuperar la contraseña</h4><p class="desc">Escribe el correo de tu cuenta y te enviaremos un enlace para elegir una contraseña nueva.</p>
    <form data-accf="reset"><label class="fld"><span>Correo</span><input type="email" id="acc-email" autocomplete="username" value="${em}" required></label>
    <div class="acts"><button class="btn pri" type="submit">Enviar el enlace</button></div></form><p><button class="alink" data-accm="login">Volver a iniciar sesión</button></p></div>`;
  if (md === 'signup') return h + `<div class="acc">${tabs3}${m}<form data-accf="signup">
    <label class="fld"><span>Nombre</span><input id="acc-name" autocomplete="name" maxlength="40" required></label>
    <label class="fld"><span>Correo</span><input type="email" id="acc-email" autocomplete="username" value="${em}" required></label>
    <div class="two"><label class="fld"><span>Contraseña (mínimo 8)</span><input type="password" id="acc-pass" autocomplete="new-password" minlength="8" required></label><label class="fld"><span>Repítela</span><input type="password" id="acc-pass2" autocomplete="new-password" minlength="8" required></label></div>
    <div class="acts"><button class="btn pri" type="submit">Crear la cuenta</button></div></form>
    <p class="desc">Te llegará un correo para confirmar la dirección. Hasta entonces, los planos se guardan solo en este navegador.</p></div>`;
  return h + `<div class="acc">${tabs3}${m}<form data-accf="login">
    <label class="fld"><span>Correo</span><input type="email" id="acc-email" autocomplete="username" value="${em}" required></label>
    <label class="fld"><span>Contraseña</span><input type="password" id="acc-pass" autocomplete="current-password" required></label>
    <label class="chk"><input type="checkbox" id="acc-rem" checked> Mantener la sesión abierta en este ordenador</label>
    <div class="acts"><button class="btn pri" type="submit">Entrar</button></div></form>
    <p><button class="alink" data-accm="reset">¿Has olvidado la contraseña?</button></p></div>`;
}
/* Cambia los planos que se ven: los del usuario que entra o los de este navegador sin cuenta */
function switchWorkspace(ns) {
  if (Store.ns === ns) return false;
  if (sim.on) simStop();
  plcClose();
  for (const t of tabs) { clearTimeout(t._st); Store.putLocal({id: t.id, name: t.name, meta: t.meta, doc: bookPlain(t.book), updated: t.updated || Date.now()}); }
  saveSession();
  Store.ns = ns; tabs = []; cur = 0;
  try {
    const ses = JSON.parse(lsGet(K('sesion')) || 'null');
    if (ses && Array.isArray(ses.open)) for (const id of ses.open) { const r = Store.getLocal(id); if (r && r.doc) tabs.push(tabFrom(r)); }
    if (tabs.length) cur = Math.max(0, tabs.findIndex(t => t.id === ses.cur));
  } catch (_) { tabs = []; }
  if (!tabs.length) { tabs = [tabFrom(newRec('Plano 1'))]; cur = 0; }
  const t = tabs[cur]; book = t.book; doc = t.doc; undoS = t.undo; redoS = t.redo; selection.clear();
  renderTabs(); renderSheets(); inspector(true); updateBtns(); saveSession(); fit(); draw();
  return true;
}
async function onUser(u) {
  acct.user = u; acct.ready = true;
  if (u && !u.emailVerified) { try { await u.reload(); u = FB.auth.currentUser; acct.user = u; if (u && u.emailVerified) await u.getIdToken(true); } catch (_) {} }
  if (u && u.emailVerified) {
    lsSet('banco:ultimo-usuario', u.uid);
    switchWorkspace(u.uid);
    const col = FB.db.collection('usuarios').doc(u.uid).collection('planos');
    try {
      const remote = new Map();
      (await col.get()).docs.forEach(d => remote.set(d.id, (d.data() || {}).updated || 0));
      Store.col = col;
      for (const f of Store.idx()) if ((remote.get(f.id) || 0) < f.updated) { const r = Store.getLocal(f.id); if (r) await Store.put(r); }
      setSst('cloud');
    } catch (e) { Store.col = null; toast(errTxt(e) + ' Los planos se guardan en este navegador.', 'err'); }
  } else {
    Store.col = null;
    if (!u) { lsDel('banco:ultimo-usuario'); switchWorkspace(''); }
    setSst('local');
  }
  updUser();
  if (!homeEl.hidden) { libCache = await Store.list(); renderHome(); }
}
async function accDo(kind, form) {
  if (!FB) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const say = (k, t) => { acct.msg = {k, t}; renderHome(); };
  const btns = hmain.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  const u = FB.auth.currentUser;
  try {
    if (kind === 'login') {
      const email = v('acc-email').trim(); acct.email = email;
      const rem = document.getElementById('acc-rem');
      await FB.auth.setPersistence(rem && !rem.checked ? firebase.auth.Auth.Persistence.SESSION : firebase.auth.Auth.Persistence.LOCAL);
      await FB.auth.signInWithEmailAndPassword(email, v('acc-pass'));
      acct.msg = null;
    } else if (kind === 'signup') {
      const name = v('acc-name').trim(), email = v('acc-email').trim(), p1 = v('acc-pass'), p2 = v('acc-pass2'); acct.email = email;
      if (!name) return say('err', 'Escribe tu nombre.');
      if (p1.length < 8) return say('err', 'La contraseña tiene que tener al menos 8 caracteres.');
      if (p1 !== p2) return say('err', 'Las dos contraseñas no coinciden.');
      const cred = await FB.auth.createUserWithEmailAndPassword(email, p1);
      await cred.user.updateProfile({displayName: name});
      await cred.user.sendEmailVerification({url: siteUrl()});
      acct.user = FB.auth.currentUser;
      return say('ok', 'Cuenta creada. Solo falta confirmar el correo.');
    } else if (kind === 'reset') {
      const email = v('acc-email').trim(); acct.email = email;
      await FB.auth.sendPasswordResetEmail(email, {url: siteUrl()});
      acct.mode = 'login';
      return say('ok', 'Si hay una cuenta con ese correo, te llegará un enlace para elegir una contraseña nueva. Mira también en el correo no deseado.');
    } else if (kind === 'resend' && u) { await u.sendEmailVerification({url: siteUrl()}); return say('ok', 'Correo reenviado a ' + u.email + '.'); }
    else if (kind === 'check' && u) {
      await u.reload(); const u2 = FB.auth.currentUser;
      if (!u2.emailVerified) return say('err', 'Todavía no consta como confirmado. Abre el enlace del correo y vuelve a pulsar.');
      await u2.getIdToken(true); acct.msg = {k: 'ok', t: 'Correo confirmado. ¡Bienvenido!'}; await onUser(u2); return;
    } else if (kind === 'logout') {
      const uid = u && u.uid;
      let synced = !!Store.col;
      for (const t of tabs) { clearTimeout(t._st); if ((await persist(t)) !== 'cloud') synced = false; }
      await FB.auth.signOut();
      /* en un ordenador compartido no deja rastro: si todo está en la nube, borra la copia local de ese usuario */
      if (uid && synced) { try { for (const k of Object.keys(localStorage)) if (k.startsWith('banco:u:' + uid + ':')) localStorage.removeItem(k); } catch (_) {} }
      acct.mode = 'login'; acct.msg = {k: 'ok', t: 'Sesión cerrada.'};
    } else if (kind === 'pass' && u) {
      const p1 = v('acc-new'), p2 = v('acc-new2');
      if (p1.length < 8) return say('err', 'La contraseña nueva tiene que tener al menos 8 caracteres.');
      if (p1 !== p2) return say('err', 'Las dos contraseñas nuevas no coinciden.');
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, v('acc-cur')));
      await u.updatePassword(p1);
      return say('ok', 'Contraseña cambiada.');
    } else if (kind === 'delete' && u) {
      if (v('acc-del').trim().toUpperCase() !== 'BORRAR') return say('err', 'Escribe BORRAR para confirmar.');
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, v('acc-delp')));
      const col = FB.db.collection('usuarios').doc(u.uid).collection('planos');
      for (const d of (await col.get()).docs) await col.doc(d.id).delete();
      const uid = u.uid;
      Store.col = null;
      await u.delete();
      try { for (const k of Object.keys(localStorage)) if (k.startsWith('banco:u:' + uid + ':')) localStorage.removeItem(k); } catch (_) {}
      acct.msg = {k: 'ok', t: 'Cuenta borrada.'};
    } else if (kind === 'import' && u) {
      let n = 0;
      const ids = JSON.parse(lsGet('banco:indice') || '[]').map(x => x.id);
      for (const id of ids) { const r = JSON.parse(lsGet('banco:f:' + id) || 'null'); if (r && r.doc) { await Store.put(r); n++; } }
      libCache = await Store.list();
      return say('ok', n + ' plano' + (n === 1 ? '' : 's') + ' pasado' + (n === 1 ? '' : 's') + ' a tu cuenta. Están en Abrir.');
    }
  } catch (e) { return say('err', errTxt(e)); }
  finally { hmain.querySelectorAll('button').forEach(b => b.disabled = false); }
  renderHome();
}
hmain.addEventListener('submit', e => { const f = e.target.closest('[data-accf]'); if (!f) return; e.preventDefault(); accDo(f.dataset.accf, f); });
$('#b-user').addEventListener('click', () => openHome('cuenta'));
if (FB) { lsGet('banco:ultimo-usuario') && (Store.ns = lsGet('banco:ultimo-usuario')); FB.auth.onAuthStateChanged(u => { onUser(u); }); }
updUser();

/* ---------- arranque ---------- */
window.addEventListener('error', e => { try { toast('Error del programa: ' + (e.message || 'desconocido'), 'err'); } catch (_) {} });
buildGrid(); buildPal();
wstyle.ask = lsGet('banco:preguntarColor') !== '0';
(function boot() {
  try {
    const ses = JSON.parse(lsGet(K('sesion')) || 'null');
    if (ses && Array.isArray(ses.open)) for (const id of ses.open) { const r = Store.getLocal(id); if (r && r.doc) tabs.push(tabFrom(r)); }
    if (tabs.length) cur = Math.max(0, tabs.findIndex(t => t.id === ses.cur));
  } catch (_) { tabs = []; }
  if (!tabs.length && !Store.ns) {
    /* Planos de la primera versión del programa (un plano en curso y una lista de guardados) */
    const migr = [];
    try { const a = JSON.parse(lsGet('banco-automatismos:actual') || 'null'); if (a && Array.isArray(a.comps) && a.comps.length) migr.push(newRec('Mi plano', a)); } catch (_) {}
    try { const L = JSON.parse(lsGet('banco-automatismos:guardados') || '[]'); if (Array.isArray(L)) for (const s of L) if (s && s.doc) migr.push(newRec(s.name, s.doc)); } catch (_) {}
    migr.forEach(r => Store.putLocal(r));
    if (migr.length) { tabs = [tabFrom(migr[0])]; lsDel('banco-automatismos:actual'); lsDel('banco-automatismos:guardados'); }
    else tabs = [tabFrom(newRec('Plano 1'))];
    cur = 0;
  }
  if (!tabs.length) { tabs = [tabFrom(newRec('Plano 1'))]; cur = 0; }
  const t = tabs[cur]; book = t.book; doc = t.doc; undoS = t.undo; redoS = t.redo;
  renderTabs(); setTool('select', true); hint(); updateBtns(); inspector(true); draw(); saveSession();
  const go = () => { fit(); draw(); };
  requestAnimationFrame(go); setTimeout(go, 120);
  openHome('inicio');
})();
/* Guardado en la cuenta: carpeta privada de cada usuario (data/users/<id>).
   Nunca se pide permiso al abrir: el visor oscurece la página mientras espera la respuesta.
   Al abrir solo se conecta si el permiso ya estaba concedido; si no, lo pide el botón «Guardar también en mi cuenta». */
async function cloudInit(ask) {
  if (Store.col) return true;
  try {
    if (!window.claude || !window.claude.use) { if (ask) toast('Esta opción solo funciona dentro de Claude'); return false; }
    const perm = await window.claude.use('permissions');
    if (perm) {
      let st = await perm.state();
      if (st.db !== 'granted' || st.user !== 'granted') {
        if (!ask) return false;
        st = await perm.request(['db', 'user']);
        if (st.db !== 'granted' || st.user !== 'granted') { toast('Sin permiso: los planos siguen guardándose en este navegador'); return false; }
      }
    } else if (!ask) return false;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) { if (ask) toast('Tu cuenta no permite guardar planos aquí: se quedan en este navegador'); return false; }
    const id = await user.id(); if (!id) return false;
    const col = db.collection('data/users/' + id);
    const remote = new Map();
    (await col.get()).docs.forEach(d => remote.set(d.id, (d.data() || {}).updated || 0));
    Store.col = col;
    for (const f of Store.idx()) if ((remote.get(f.id) || 0) < f.updated) { const r = Store.getLocal(f.id); if (r) await Store.put(r); }
    setSst('cloud');
    return true;
  } catch (_) { Store.col = null; if (ask) toast('No se ha podido conectar con tu cuenta', 'err'); return false; }
}
cloudInit(false).then(ok => { if (ok && !homeEl.hidden) Store.list().then(L => { libCache = L; renderHome(); }); });
window.addEventListener('beforeunload', () => { for (const t of tabs) if (t._st) { clearTimeout(t._st); Store.putLocal({id: t.id, name: t.name, meta: t.meta, doc: bookPlain(t.book), updated: t.updated}); } saveSession(); });
})();
